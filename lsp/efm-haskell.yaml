version: 2
lint-debounce: 500ms
languages:
  haskell:
    - lint-command: 'ghc -dynamic -fno-code -fdiagnostics-color=never -fno-diagnostics-show-caret -Wall -outputdir "${TMPDIR:-/tmp}/tezcatl-ghc" -i"$(dirname ${INPUT})" -isrc ${INPUT}'
      lint-stdin: false
      lint-ignore-exit-code: true
      lint-after-open: true
      lint-on-save: true
      lint-source: ghc
      lint-formats:
        - '%E%f:%l:%c: error: %m'
        - '%W%f:%l:%c: warning: %m'
        - '%C    %m'
        - '%-G%.%#'
