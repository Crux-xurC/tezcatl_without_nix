<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tezcatl — xterm_cutoff (compile output mirror)</title>
<link rel="stylesheet" href="../../lib/core/tezcatl.css">
<link rel="stylesheet" href="../../lib/core/fonts.css">
<link rel="stylesheet" href="../../lib/vendor/xterm/xterm.css">

<style>
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #ccc; display: flex; flex-direction: column; }
  #status { flex: 0 0 auto; margin: 0; padding: 4px 10px; font: 12px/1.5 system-ui, sans-serif;
            background: #111; border-bottom: 1px solid #333; color: #9a7fc0; }
  #term { flex: 1 1 auto; min-height: 0; padding: 4px 6px; overflow: hidden; }
</style>
</head>
<body>
<div id="status">xterm_cutoff — waiting…</div>
<div id="term"></div>

<script src="../../lib/vendor/xterm/xterm.js"></script>
<script src="../../lib/vendor/xterm/addon-fit.js"></script>
<script src="../../lib/core/config.js"></script>
<script src="../../lib/core/panel-bus.js"></script>
<script src="../../lib/core/panel-frame.js"></script>
<script src="../../lib/term/terminal-mirror.js"></script>
<script>
(function () {
  'use strict';
  var bus = Tezcatl.bus;
  var Q = new URLSearchParams(location.search);
  var NAME = Q.get('name') || 'xterm_cutoff';
  var statusEl = document.getElementById('status');

  if (typeof Terminal === 'undefined' || typeof FitAddon === 'undefined') {
    statusEl.textContent = 'xterm_cutoff: could not load xterm.js (../lib/vendor/xterm/).';
    return;
  }

  Tezcatl.panelFrame.init({ role: 'xterm_cutoff', name: NAME });

  var source = Q.get('source') || null;
  var codeId = Q.get('code') || null;
  var req = Q.get('req') || null;

  var mirror = Tezcatl.terminalMirror.mount(document.getElementById('term'), {
    source: source,
    onLink: function (path, line, col) {
      // Known rough edge: this always jumps whichever code panel this
      // compile run was started from (codeId), even if the matched path
      // refers to a different file in a multi-file build error. Good enough
      // for the common single-file-open case; a fuller code.open + wait +
      // code.goto sequence would be needed to always open the right file.
      if (codeId) bus.post('code.goto', { line: line, col: col }, { to: codeId });
    },
  });

  function announceReady() {
    statusEl.textContent = 'xterm_cutoff — mirroring ' + (source || '(no source)');
    bus.post('terminal.ready', { req: req });
  }

  // Reuse path: an enclosing skin (skins/basic.html) may retarget an
  // existing pane at a new compile run instead of opening a fresh one.
  bus.onMine('terminal.reconfigure', function (payload) {
    source = (payload && payload.source) || null;
    codeId = (payload && payload.code) || null;
    req = (payload && payload.req) || null;
    mirror.setSource(source);
    announceReady();
  });

  announceReady();
})();
</script>
</body>
</html>
