<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tezcatl — code_xipe_in (Xipe Totec input)</title>
<link rel="stylesheet" href="../../lib/core/tezcatl.css">
<link rel="stylesheet" href="../../lib/core/fonts.css">

<style>
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #ddd; display: flex;
         flex-direction: column; font-family: var(--tz-ui-font, monospace); }
  #head { flex: 0 0 auto; display: flex; gap: 1em; align-items: center;
          padding: 3px 10px; font: 11px/1.6 var(--tz-ui-font, monospace);
          background: #0a0710; color: #9a7fc0; border-bottom: 1px solid #241a33; }
  #head b { color: #ff9f1c; font-weight: normal; }
  #head .hint { color: #6a5c80; }
  #editor { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .cm-editor { height: 100%; }
  .cm-editor.cm-focused { outline: none; }
  .cm-scroller { overflow: auto; }
</style>
</head>
<body>
<div id="head">
  <b id="name">code_xipe_in</b>
  <span id="lang">xipe</span>
  <span class="hint">Mod-Enter: send (one per line) · dictionary candidates show as you type</span>
  <span id="msg" class="hint"></span>
</div>
<div id="editor"></div>

<script src="../../lib/core/config.js"></script>
<script src="../../lib/core/ticket.js"></script>
<script src="../../lib/core/panel-bus.js"></script>
<script src="../../lib/core/panel-frame.js"></script>
<script src="../../lib/code/code-languages.js"></script>
<script type="module">
// Input of the Xipe dialogue window. Mod-Enter posts xipe.input {text} (the
// buffer as typed) to the skin, which sends each non-blank line as Xipe
// Totec's `input` method -- nothing here interprets the text (like
// emacs-vent's single `input` kind). Dictionary candidates come from the
// skin's dict pane (dict.words, lib/code/code-editor.js).
import { keymap, Prec } from "../../lib/vendor/codemirror/cm.bundle.js";
import { createCodeEditor } from "../../lib/code/code-editor.js";

const bus = window.Tezcatl && window.Tezcatl.bus;
let ed = null;

function send() {
  const text = ed.getText();
  if (!text.trim()) return true;
  if (bus) bus.post("xipe.input", { text });
  ed.setDoc("");
  ed.flash("sent");
  return true;
}

ed = createCodeEditor({
  editable: true,
  role: "xipe-in",
  surface: "xipe-in",
  name: "code_xipe_in",
  head: { msg: document.getElementById("msg") },
  extraExtensions: [Prec.highest(keymap.of([{ key: "Mod-Enter", preventDefault: true, run: send }]))],
});
document.getElementById("name").textContent = ed.name;
</script>
</body>
</html>
