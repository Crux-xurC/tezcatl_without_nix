<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tezcatl — code_el_intent (extension transcript)</title>
<link rel="stylesheet" href="../../lib/core/tezcatl.css">
<link rel="stylesheet" href="../../lib/core/fonts.css">

<style>
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #ddd; display: flex;
         flex-direction: column; font-family: var(--tz-ui-font, monospace); }
  #head { flex: 0 0 auto; display: flex; gap: 1em; align-items: center;
          padding: 3px 10px; font: 11px/1.6 var(--tz-ui-font, monospace);
          background: #0a0710; color: #9a7fc0; border-bottom: 1px solid #241a33; }
  #head b { color: #ff9f1c; font-weight: normal; }
  #head .ro { color: #fc6; }
  #head .hint { color: #6a5c80; }
  #editor { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .cm-editor { height: 100%; }
  .cm-editor.cm-focused { outline: none; }
  .cm-scroller { overflow: auto; }
  .cm-panels { background: #0a0710; color: #ddd; border-color: #241a33 !important; }
</style>
</head>
<body>
<div id="head">
  <b id="name">code_el_intent</b>
  <span id="lang">elisp</span>
  <span id="ro" class="ro">transcript</span>
  <span id="msg" class="hint"></span>
</div>
<div id="editor"></div>

<script src="../../lib/core/config.js"></script>
<script src="../../lib/core/ticket.js"></script>
<script src="../../lib/core/panel-bus.js"></script>
<script src="../../lib/core/panel-frame.js"></script>
<script src="../../lib/code/code-languages.js"></script>
<script type="module">
import { createCodeEditor } from "../../lib/code/code-editor.js";

const ed = createCodeEditor({
  editable: false,
  role: "el-intent",
  surface: "el-intent",
  name: "code_el_intent",
  head: {
    lang: document.getElementById("lang"),
    ro: document.getElementById("ro"),
    msg: document.getElementById("msg"),
  },
  onUpdate: (u, view) => {
    if (!u.docChanged) return;
    requestAnimationFrame(() => {
      try {
        view.dispatch({
          selection: { anchor: view.state.doc.length },
          scrollIntoView: true,
        });
      } catch (_) {}
    });
  },
});
document.getElementById("name").textContent = ed.name;
ed.flash("waiting for the intent transcript -- run an intent from the input panel");
</script>
</body>
</html>
