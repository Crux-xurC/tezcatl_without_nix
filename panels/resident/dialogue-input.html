<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../lib/core/fonts.css">
<title>Tezcatl — dialogue input</title>
<link rel="stylesheet" href="../../lib/core/tezcatl.css">
</head>
<body>
<h1>Tezcatl dialogue input — emacs-vent dialogue bridge, driving side (browser → Emacs)</h1>
<div id="root"></div>


<script src="../../lib/vent/protocol.js"></script>
<script src="../../lib/core/keymap.js"></script>
<script src="../../lib/core/kbd.js"></script>
<script src="../../lib/core/text.js"></script>
<script src="../../lib/vent/middleware.js"></script>
<script src="../../lib/core/config.js"></script>
<script src="../../lib/core/ticket.js"></script>
<script src="../../lib/core/ws.js"></script>
<script src="../../lib/vent/vent-init.js"></script>
<script src="../../lib/vent/elisp.js"></script>
<script src="../../lib/vent/resolver-trace.js"></script>
<script src="../../lib/vent/decode-table.js"></script>
<script src="../../lib/db/sql.js"></script>
<script src="../../lib/vent/resolver.js"></script>
<script src="../../lib/core/panel-bus.js"></script>
<script src="../../lib/core/panel-frame.js"></script>
<script src="../../lib/vent/input-panel.js"></script>
<script>
  var lastContext = null;
  var panel = Tezcatl.inputPanel.mount(document.getElementById('root'), {
    send: function (obj) { return Tezcatl.ws.send(obj); },
    getContext: function () { return lastContext; },
  });

  Tezcatl.panelFrame.init({
    role: 'dl-input',
    name: new URLSearchParams(location.search).get('name') || 'dl-input',
  });

  Tezcatl.resolver.load()
    .then(function (r) {
      panel.log('in-meta', 'resolver: ' + r.intents + ' intents, ' + r.bindings +
        ' bindings (' + r.dialect + '), uplink ' +
        (r.uplinkTracked ? 'tracked via GET /windows' : 'NOT tracked (no vent connection url)') +
        (r.problems.length ? '  — problems: ' + r.problems.join(' | ') : '') +
        '.  Tip: type an intent id (e.g. magit.unstaged-files) in the Form field to run it.');
    })
    .catch(function (e) {
      panel.log('out-fail', 'resolver load failed: ' + (e && e.message || e) +
        ' — form falls back to raw send only');
    });

  Tezcatl.ws.connectFromConfig({
    onMessage: function (m) {
      if (m.kind === 'context') { lastContext = m; panel.setTarget(m); }
      panel.onInbound(m);
    },
    onState: function (s) {
      panel.setState(s);
      if (s === 'open') Tezcatl.ventInit.requestContext(Tezcatl.ws.send);
    },
  });
</script>
</body>
</html>
