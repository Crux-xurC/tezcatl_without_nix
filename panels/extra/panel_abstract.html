<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tezcatl — panel_abstract</title>
<link rel="stylesheet" href="../../lib/core/fonts.css">
<style>
  /* The map of a frame: its lines and panels as boxes, the focused one filled.
     Drawn from what the frame gives (window.abstractSet); the boxes are placed
     by lib/skin/panel-abstract-page.js as fractions of #map. */
  :root { --ab-line: #5a4c70; --ab-empty: #3a3048; --ab-focus: #8cb4ff; --ab-fg: #9a7fc0; --ab-bg: #0a0710; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ab-bg);
               font: 10px/1 var(--tz-ui-font, monospace); color: var(--ab-fg); }
  body { box-sizing: border-box; padding: 4px; border: 1px solid transparent; outline: none; }
  /* the keyboard is here: hjkl / the arrows move the focus */
  body.keys { border-color: var(--ab-focus); }
  #map { position: relative; width: 100%; height: 100%; }
  .line, .cell { position: absolute; box-sizing: border-box; }
  .line { border: 1px dashed var(--ab-empty); }
  .cell { border: 1px solid var(--ab-line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cell.focused { background: var(--ab-focus); border-color: var(--ab-focus); color: #000; }
</style>
</head>
<body tabindex="0">
<div id="map"></div>
<script src="../../lib/core/config.js"></script>
<script src="../../lib/core/panel-bus.js"></script>
<script src="../../lib/core/panel-frame.js"></script>
<script src="../../lib/skin/panel-abstract-page.js"></script>
</body>
</html>
