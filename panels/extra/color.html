<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tezcatl — color</title>
<link rel="stylesheet" href="../../lib/core/tezcatl.css">
<link rel="stylesheet" href="../../lib/core/fonts.css">
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  #swatch { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: .4em; background: #000; color: #fff; font: 13px/1.4 var(--tz-ui-font, monospace); }
  #value { font-size: 22px; font-weight: bold; }
  #what { opacity: .8; }
  #err { position: absolute; left: .6em; right: .6em; bottom: .4em; color: #ff7a6b; background: #000a;
         font: 12px/1.4 var(--tz-ui-font, monospace); }
  #err:empty { display: none; }
</style>
</head>
<body>
<div id="swatch"><span id="value"></span><span id="what"></span></div>
<div id="err"></div>
<script src="../../lib/core/config.js"></script>
<script src="../../lib/core/panel-bus.js"></script>
<script src="../../lib/core/panel-frame.js"></script>
<script src="../../lib/core/commands.js"></script>
<script src="../../lib/view/color.js"></script>
<script src="../../lib/view/color-page.js"></script>
</body>
</html>
